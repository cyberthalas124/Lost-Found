<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติการแจ้ง | SAPA Lost and Found</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <nav class="navbar">
        <div class="navbar-brand" onclick="window.location.href='index.html'">
            <div class="logo-wrapper"><img src="images/sapa.png" alt="SAPA Logo" class="navbar-logo"></div>
            <div class="navbar-text-group"><span class="navbar-title">SAPA Lost & Found</span></div>
        </div>
        <div class="navbar-right">
            <div class="nav-icon-btn" onclick="window.location.href='dashboard.html'"><i class="fa-solid fa-house"></i></div>
        </div>
    </nav>

    <section class="container">
        <div class="section-header">
            <h2 class="section-title">ประวัติการแจ้งรายการของคุณ</h2>
            <div class="section-line"></div>
        </div>
        <div id="history-list" class="items-grid"></div>
        <div id="no-history" class="text-center " style="padding: 100px;">
            <i class="fa-solid fa-folder-open" style="font-size: 4rem; color: #ddd; margin-bottom: 20px;"></i>
            <p style="color: #999;">คุณยังไม่มีประวัติการแจ้งรายการ</p>
        </div>
    </section>

    <script type="module" src="app.js"></script>

</html>
